<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex">
<title>Настройки листинг-бота</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-secondary-bg-color, #f0f0f4);
    --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #ffffff));
    --text: var(--tg-theme-text-color, #111114);
    --hint: var(--tg-theme-hint-color, #8b8b92);
    --accent: var(--tg-theme-button-color, #2481cc);
    --on-accent: var(--tg-theme-button-text-color, #ffffff);
    --line: var(--tg-theme-section-separator-color, rgba(128, 128, 128, .2));
    --danger: var(--tg-theme-destructive-text-color, #e0443a);
    --up: #2fa84f;
    --field: rgba(128, 128, 128, .12);
    --shadow: 0 1px 2px rgba(0, 0, 0, .12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: var(--tg-theme-secondary-bg-color, #0e0e10);
      --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #1b1b1e));
      --text: var(--tg-theme-text-color, #f2f2f4);
      --shadow: 0 1px 2px rgba(0, 0, 0, .5);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    padding: 10px 12px 24px; -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased;
  }
  main { max-width: 520px; margin: 0 auto; }
  button { font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }

  /* the top line */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 2px 10px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; letter-spacing: .03em;
          padding: 3px 9px; border-radius: 999px; background: var(--field); color: var(--hint); white-space: nowrap; }
  .chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .8; }
  .chip.live { background: color-mix(in srgb, var(--danger) 16%, transparent); color: var(--danger); }
  .asof { font-size: 11px; color: var(--hint); }

  /* tabs */
  .tabs { position: sticky; top: 0; z-index: 5; display: flex; gap: 2px; padding: 2px; margin: 0 0 12px; border-radius: 10px;
          background: var(--bg); box-shadow: 0 0 0 100vmax var(--bg); clip-path: inset(-10px -100vmax -6px); }
  .tabs::before { content: ""; position: absolute; inset: 0; border-radius: 10px; background: var(--field); pointer-events: none; }
  .tab { position: relative; flex: 1 1 0; min-width: 0; font-size: 13px; font-weight: 600; color: var(--hint);
         background: transparent; border: 0; border-radius: 8px; padding: 6px 2px; white-space: nowrap; }
  .tab[aria-selected=true] { background: var(--card); color: var(--text); box-shadow: var(--shadow); }
  .tab .n { display: inline-block; min-width: 16px; margin-left: 4px; padding: 0 4px; border-radius: 999px; font-size: 10.5px;
            line-height: 16px; background: var(--accent); color: var(--on-accent); }
  .tab.dim { opacity: .5; }
  .tab.dim[aria-selected=true] { opacity: .85; }

  /* cards and rows */
  .card { background: var(--card); border-radius: 14px; margin-bottom: 12px; overflow: hidden; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 14px; }
  .head h2 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
  .head .state { font-size: 12px; color: var(--hint); }
  .group { font-size: 10.5px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase; color: var(--hint);
           padding: 14px 14px 4px; }
  .row { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 10px;
         padding: 8px 14px; min-height: 42px; }
  .row::before { content: ""; position: absolute; left: 14px; right: 0; top: 0; border-top: 1px solid var(--line); }
  .group + .row::before, .head + .row::before, .body > .row:first-child::before { display: none; }
  .row label, .row .label { flex: 1 1 auto; min-width: 0; font-size: 14px; }
  .row small { display: block; color: var(--hint); font-size: 11.5px; line-height: 1.3; margin-top: 1px; }
  .ctl { display: flex; align-items: center; gap: 5px; flex: 0 0 auto; }
  .ctl .unit { color: var(--hint); font-size: 12px; min-width: 28px; white-space: nowrap; }  /* the fields stand in one column */
  .calc { color: var(--hint); font-size: 11.5px; padding: 0 14px 8px; margin-top: -4px; }
  .err { color: var(--danger); font-size: 11.5px; padding: 0 14px 8px; margin-top: -4px; text-align: right; }
  .off .body, .unused { opacity: .42; }
  .unused { pointer-events: none; }

  input[type=text] {
    font: inherit; font-size: 14px; color: var(--text); background: var(--field); border: 1.5px solid transparent;
    border-radius: 8px; padding: 5px 8px; width: 74px; text-align: right; outline: none; font-variant-numeric: tabular-nums;
    -webkit-appearance: none; appearance: none;
  }
  input[type=text]:focus { border-color: var(--accent); }
  input[type=text]::placeholder { color: var(--hint); }
  input.bad { border-color: var(--danger); }

  /* a choice of two to four */
  .seg { display: inline-flex; flex: 0 0 auto; padding: 2px; gap: 2px; border-radius: 9px; background: var(--field); }
  .seg button { border: 0; background: transparent; color: var(--hint); font-size: 12px; font-weight: 600;
                padding: 5px 10px; border-radius: 7px; min-width: 44px; }
  .seg button[aria-pressed=true] { background: var(--card); color: var(--text); box-shadow: var(--shadow); }

  /* one button that flips between two values, the size of a field */
  .flip { width: 74px; font-size: 13px; font-weight: 650; letter-spacing: .04em; color: var(--text); background: var(--field);
          border: 1.5px solid transparent; border-radius: 8px; padding: 5px 8px; text-align: center; }
  .flip:active { border-color: var(--accent); }

  /* the sub-tabs of an exchange */
  .sub { display: flex; gap: 2px; padding: 2px; margin: 0 14px 4px; border-radius: 9px; background: var(--field); }
  .sub button { flex: 1 1 0; border: 0; background: transparent; color: var(--hint); font-size: 12.5px; font-weight: 600;
                padding: 5px 0; border-radius: 7px; }
  .sub button[aria-selected=true] { background: var(--card); color: var(--text); box-shadow: var(--shadow); }

  /* switch */
  .switch { position: relative; width: 42px; height: 25px; flex: 0 0 auto; }
  .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; width: 100%; height: 100%; cursor: pointer; z-index: 1; }
  .switch span { position: absolute; inset: 0; border-radius: 999px; background: rgba(128, 128, 128, .32); transition: background .15s; }
  .switch span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 21px; height: 21px; border-radius: 50%;
                        background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .3); transition: transform .15s; }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(17px); }
  .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* buttons */
  .btn { display: block; width: 100%; font-size: 14px; font-weight: 600; border: 0; border-radius: 10px; padding: 11px;
         background: var(--accent); color: var(--on-accent); margin: 0 0 10px; }
  .btn.plain { background: transparent; color: var(--danger); font-weight: 500; font-size: 13px; padding: 8px; }
  .btn.danger { background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); margin: 0; }
  .btn.small { width: auto; margin: 0; padding: 7px 12px; font-size: 13px; white-space: nowrap; }
  .btn.ghost { background: var(--field); color: var(--text); }

  /* positions */
  .kind { font-size: 10.5px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; color: var(--hint);
          background: var(--field); border-radius: 5px; padding: 1px 5px; margin-left: 7px; vertical-align: 2px; }
  .move { font-size: 14px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .move.up { color: var(--up); }
  .move.down { color: var(--danger); }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; padding: 0 14px 12px; }
  .facts div { min-width: 0; }
  .facts .wide { grid-column: 1 / -1; }
  .facts small { display: block; color: var(--hint); font-size: 11px; }
  .facts b { font-size: 13.5px; font-weight: 550; font-variant-numeric: tabular-nums; word-break: break-all; }
  .acts { position: relative; padding: 12px 14px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 9px; }
  .acts::before { content: ""; position: absolute; left: 14px; right: 0; top: 0; border-top: 1px solid var(--line); }
  .acts .line { display: flex; align-items: center; gap: 8px; }
  .acts .line input { flex: 1 1 auto; width: auto; min-width: 0; text-align: left; }
  .acts .line span, .standing span { color: var(--hint); font-size: 12.5px; flex: 0 0 auto; }
  .standing { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

  /* text */
  .note { font-size: 11.5px; line-height: 1.4; color: var(--hint); padding: 0 6px 10px; margin: 0; }
  .banner { background: var(--card); border-radius: 12px; padding: 11px 14px; margin-bottom: 12px; font-size: 13px; color: var(--hint); }
  .banner b { display: block; margin-bottom: 2px; color: var(--text); font-size: 14px; }
  .empty { text-align: center; color: var(--hint); font-size: 12.5px; padding: 30px 24px; }
  .empty b { display: block; color: var(--text); font-size: 15px; margin-bottom: 4px; }
  .away { padding: 2px 14px 14px; color: var(--hint); font-size: 12.5px; line-height: 1.45; }
  pre { background: var(--card); border-radius: 12px; padding: 12px; font-size: 11px; white-space: pre-wrap; word-break: break-all; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="banner" id="problem" hidden></div>
  <div id="app" hidden>
    <div class="top">
      <span class="chip" id="mode"></span>
      <span class="asof" id="asof"></span>
    </div>
    <div class="banner" id="preview" hidden><b>Открыто не из Telegram</b>Боту отсюда ничего не уходит: кнопки покажут внизу, что ушло бы.</div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <div id="panes"></div>
    <button class="btn" id="save" hidden>Сохранить настройки</button>
    <pre id="out" hidden></pre>
  </div>
</main>
<script>
"use strict";
// The order of the fields is the bot's (bot/tuning.py: COMMON_FIELDS, VENUE_FIELDS): both sides must agree.
const VERSION = 5;
const COMMON_FIELDS = ["max_mcap_usd", "fill_check_s"];
const POSITION_FIELDS = ["key", "size", "entry", "mark", "tp", "sl", "limit"];
const VENUE_FIELDS = ["enabled", "entry_mode", "leverage", "fut_margin_pct", "fut_price_cap_pct", "fut_tif", "fut_order_ttl_s",
                      "fut_chase_pct", "max_notional_usd", "spot_pct", "spot_price_cap_pct", "spot_tif", "spot_order_ttl_s",
                      "spot_chase_pct", "tp_pct", "sl_pct", "sl_delay_s", "max_hold_min"];
// a row shown on these exchanges only; elsewhere its value goes back as it came
const ONLY = {spot_chase_pct: ["binance"]};
const TITLES = {gate: "Gate", binance: "Binance"};
// a choice: [value, button, what it means]
const ENTRY = [["auto", "Авто", "Авто: перп, а если его нет — spot"], ["futures", "Перп", "Только перп"],
               ["spot", "Spot", "Только spot"], ["both", "Оба", "И перп, и spot сразу"]];
const TIF = [["gtc", "GTC", "ждёт в стакане, потом снимается"], ["ioc", "IOC", "сразу отменяется"]];
// a number: [field, label, hint, unit, lowest, highest, whole number, may be empty, shown as value / scale]
const COMMON_ROWS = [
  ["max_mcap_usd", "Потолок каппы", "Circulating cap выше — не входим", "млн $", 1, 1000000, false, false, 1e6],
  ["fill_check_s", "Снять недолитое через", "Остаток снимается; пусто — нет", "с", 0.1, 60, false, true],
];
const CAP_HINT = {binance: "Не выше края коридора Binance"};
// a group: [id, title, the sub-tab it is on, rows]
const GROUPS = [
  ["perp", "Перп", "open", [
    ["leverage", "Плечо", "Cross; или максимум контракта", "x", 1, 50, true, false],
    ["fut_margin_pct", "Маржа", "Доля баланса биржи", "%", 0.1, 100, false, false],
    ["fut_price_cap_pct", "Потолок цены", "К цене до листинга", "%", 0.1, 50, false, false],
    ["fut_tif", "Остаток ордера", "", TIF],
    ["fut_order_ttl_s", "Ждёт в стакане", "", "с", 0, 60, false, false],
    ["fut_chase_pct", "Догонять до", "К цене до листинга; пусто — нет", "%", 0.1, 300, false, true],
    ["max_notional_usd", "Макс. позиция", "0 — без ограничения", "$", 0, 10000000, false, false],
  ]],
  ["spot", "Spot", "open", [
    ["spot_pct", "Доля баланса", "Пусто — spot не используем", "%", 0.1, 100, false, true],
    ["spot_price_cap_pct", "Потолок цены", "К цене до листинга", "%", 0.1, 50, false, false],
    ["spot_tif", "Остаток ордера", "", TIF],
    ["spot_order_ttl_s", "Ждёт в стакане", "", "с", 0, 60, false, false],
    ["spot_chase_pct", "Догонять до", "К цене до листинга; пусто — нет", "%", 0.1, 300, false, true],
  ]],
  ["exit", "Выход", "close", [
    ["tp_pct", "Take-profit", "От средней цены входа", "%", 0.1, 1000, false, true],
    ["sl_pct", "Stop-loss", "От средней цены входа", "%", 0.1, 99, false, true],
    ["sl_delay_s", "SL через", "После первого налива", "с", 0, 600, false, false],
    ["max_hold_min", "Держать не дольше", "0 — без ограничения", "мин", 0, 10080, false, false],
  ]],
];

const tg = window.Telegram && window.Telegram.WebApp;
const inTelegram = !!tg && tg.platform && tg.platform !== "unknown";
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const inputs = {};  // "gate.leverage" | "common.max_mcap_usd" -> {get(), check(), node, label}
let dirty = false;

function fail(title, text) {
  $("app").hidden = true;
  const p = $("problem");
  p.hidden = false;
  p.replaceChildren(el("b", null, title), document.createTextNode(text));
  if (inTelegram) tg.MainButton.hide();
}

function readState() {
  const packed = new URLSearchParams(location.search).get("c");
  if (!packed) return null;
  const b64 = packed.replace(/-/g, "+").replace(/_/g, "/");
  const bytes = Uint8Array.from(atob(b64 + "=".repeat((4 - b64.length % 4) % 4)), (ch) => ch.charCodeAt(0));
  return JSON.parse(new TextDecoder().decode(bytes));
}

function touched() {
  if (dirty) return;
  dirty = true;
  if (inTelegram && tg.enableClosingConfirmation) tg.enableClosingConfirmation();
}

function numberRow(key, [name, label, hint, unit, lo, hi, whole, optional, scale], value, onChange) {
  const row = el("div", "row"), lab = el("label", null, label), ctl = el("div", "ctl"), inp = el("input");
  if (hint) lab.append(el("small", null, hint));
  inp.type = "text"; inp.inputMode = whole ? "numeric" : "decimal"; inp.autocomplete = "off";
  inp.id = key; lab.htmlFor = key;
  inp.value = value == null ? "" : String(+(value / (scale || 1)).toFixed(6));
  inp.placeholder = optional ? "—" : "";
  ctl.append(inp, el("span", "unit", unit));
  row.append(lab, ctl);
  const err = el("div", "err"); err.hidden = true;
  const parse = () => {
    const raw = inp.value.trim().replace(",", ".").replace(/\s+/g, "");
    if (raw === "") return optional ? [null, null] : [null, "нужно число"];
    const x = Number(raw);
    if (!isFinite(x)) return [null, "нужно число"];
    if (whole && !Number.isInteger(x)) return [null, "нужно целое число"];
    if (x < lo || x > hi) return [null, `от ${lo} до ${hi}`];
    return [x * (scale || 1), null];
  };
  const check = () => { const [, why] = parse(); inp.classList.toggle("bad", !!why); err.hidden = !why; err.textContent = why ? `${label}: ${why}` : ""; return why; };
  inp.addEventListener("input", () => { touched(); check(); if (onChange) onChange(); });
  inputs[key] = {get: () => parse()[0], check, node: inp, label};
  return [row, err];
}

function choiceRow(key, [name, label, hint, options], value, onChange) {
  // two to four buttons; the line under the label says what the chosen one means
  const row = el("div", "row"), lab = el("div", "label", label), seg = el("div", "seg");
  const wide = options.length > 2, what = el(wide ? "div" : "small", wide ? "calc" : null);
  seg.setAttribute("role", "group"); seg.setAttribute("aria-label", label);
  if (!wide) lab.append(what);
  let current = options.some(([v]) => v === value) ? value : options[0][0];
  const buttons = options.map(([v, text]) => {
    const b = el("button", null, text);
    b.type = "button";
    b.addEventListener("click", () => { if (current === v) return; current = v; touched(); paint(); if (onChange) onChange(); });
    seg.append(b);
    return [v, b];
  });
  const paint = () => {
    for (const [v, b] of buttons) b.setAttribute("aria-pressed", String(v === current));
    what.textContent = hint || options.find(([v]) => v === current)[2];
  };
  paint();
  row.append(lab, seg);
  inputs[key] = {get: () => current, check: () => null, node: seg, label};
  return wide ? [row, what] : [row];
}

function flipRow(key, [name, label, hint, options], value, onChange) {
  // two values on one button the size of a field: a tap gives the other; the line under the label says what it means
  const row = el("div", "row"), lab = el("label", null, label), what = el("small"), ctl = el("div", "ctl"), b = el("button", "flip");
  b.type = "button"; b.id = key; lab.htmlFor = key;
  lab.append(what);
  let i = Math.max(0, options.findIndex(([v]) => v === value));
  const paint = () => {
    const [, text, means] = options[i];
    b.textContent = text; what.textContent = hint || means;
    b.setAttribute("aria-label", `${label}: ${text}. Нажми, чтобы сменить`);
  };
  b.addEventListener("click", () => { i = (i + 1) % options.length; touched(); paint(); if (onChange) onChange(); });
  paint();
  ctl.append(b, el("span", "unit"));  // an empty unit: the button stands where the fields stand
  row.append(lab, ctl);
  inputs[key] = {get: () => options[i][0], check: () => null, node: b, label};
  return [row];
}

function venueCard(venue, values) {
  const at = Object.fromEntries(VENUE_FIELDS.map((f, i) => [f, values[i]]));
  const card = el("section", "card"), head = el("div", "head");
  const bodies = {open: el("div", "body"), close: el("div", "body")};
  const state = el("span", "state"), sw = el("label", "switch"), box = el("input");
  box.type = "checkbox"; box.checked = !!at.enabled; box.setAttribute("aria-label", `Торговать на ${TITLES[venue] || venue}`);
  sw.append(box, el("span"));
  const right = el("div", "ctl"); right.style.gap = "10px"; right.append(state, sw);
  head.append(el("h2", null, TITLES[venue] || venue), right);
  inputs[`${venue}.enabled`] = {get: () => box.checked, check: () => null, node: box, label: "торговать"};
  const sections = {}, rows = {}, calc = el("div", "calc");
  const refresh = () => {
    card.classList.toggle("off", !box.checked);
    state.textContent = box.checked ? "торгуем" : "выключена";
    const mode = inputs[`${venue}.entry_mode`].get();
    sections.perp.forEach((n) => n.classList.toggle("unused", mode === "spot"));
    sections.spot.forEach((n) => n.classList.toggle("unused", mode === "futures"));
    for (const side of ["fut", "spot"]) {  // the wait and the chase mean something with GTC only
      const off = inputs[`${venue}.${side}_tif`].get() === "ioc" || (side === "fut" ? mode === "spot" : mode === "futures");
      for (const f of [`${side}_order_ttl_s`, `${side}_chase_pct`]) (rows[f] || []).forEach((n) => n.classList.toggle("unused", off));
    }
    const lev = inputs[`${venue}.leverage`].get(), margin = inputs[`${venue}.fut_margin_pct`].get();
    calc.textContent = lev && margin ? `Позиция до ${+(lev * margin / 100).toFixed(2)}× баланса, в пределах лимита биржи` : "";
  };
  box.addEventListener("change", () => { touched(); refresh(); });
  bodies.open.append(...choiceRow(`${venue}.entry_mode`, ["entry_mode", "Вход", "", ENTRY], at.entry_mode, refresh));
  inputs[`${venue}.entry_mode`].sub = "open";
  for (const [id, title, where, list] of GROUPS) {
    const nodes = [el("div", "group", title)];
    for (const r of list) {
      if (ONLY[r[0]] && !ONLY[r[0]].includes(venue)) {  // not on this exchange: its value goes back untouched
        inputs[`${venue}.${r[0]}`] = {get: () => at[r[0]] == null ? null : at[r[0]], check: () => null, node: null, label: r[1]};
        continue;
      }
      const spec = r[0] === "fut_price_cap_pct" && CAP_HINT[venue] ? [r[0], r[1], CAP_HINT[venue], ...r.slice(3)] : r;
      const made = Array.isArray(r[3]) ? flipRow(`${venue}.${r[0]}`, spec, at[r[0]], refresh) : numberRow(`${venue}.${r[0]}`, spec, at[r[0]], refresh);
      inputs[`${venue}.${r[0]}`].sub = where;
      rows[r[0]] = made;
      nodes.push(...made);
      if (r[0] === "fut_margin_pct") nodes.push(calc);
    }
    sections[id] = nodes;
    bodies[where].append(...nodes);
  }
  // Open: how it enters; Close: how it gets out. One at a time
  const subs = el("div", "sub"), pick = {};
  subs.setAttribute("role", "tablist");
  for (const [id, title] of [["open", "Open"], ["close", "Close"]]) {
    pick[id] = el("button", null, title);
    pick[id].type = "button"; pick[id].setAttribute("role", "tab");
    pick[id].addEventListener("click", () => card.showSub(id));
    subs.append(pick[id]);
  }
  card.showSub = (id) => {
    for (const k of Object.keys(bodies)) { bodies[k].hidden = k !== id; pick[k].setAttribute("aria-selected", String(k === id)); }
  };
  card.append(head, subs, bodies.open, bodies.close);
  card.showSub("open");
  refresh();
  return card;
}

function awayCard(venue) {
  // an exchange the bot runs without right now: its settings are not in the button that opened the app
  const card = el("section", "card"), head = el("div", "head");
  head.append(el("h2", null, TITLES[venue] || venue), el("span", "state", "не подключена"));
  card.append(head, el("div", "away", `Бот сейчас работает без ${TITLES[venue] || venue}: её нет в VENUES в .env, ` +
    "или идёт тестовый прогон на другой бирже. Настройки появятся здесь с первым сообщением обычного бота."));
  return card;
}

function commonPane(values) {
  const pane = el("div"), card = el("section", "card"), head = el("div", "head");
  head.append(el("h2", null, "Для обеих бирж"));
  card.append(head);
  COMMON_ROWS.forEach((r, i) => card.append(...numberRow(`common.${r[0]}`, r, values[i])));
  const reset = el("button", "btn plain", "Сбросить настройки к .env");
  reset.type = "button";
  reset.addEventListener("click", () => ask("Забыть всё, что менялось здесь, и вернуться к настройкам из .env?", () => send({v: VERSION, reset: true})));
  pane.append(card, el("p", "note", "Бот применит изменения после кнопки «Подтвердить» в чате. TP и SL уже открытых позиций не меняются. Ключи бирж и DRY_RUN — только в .env на сервере."), reset);
  return pane;
}

function ask(text, go) {
  if (inTelegram && tg.showConfirm) tg.showConfirm(text, (yes) => { if (yes) go(); });
  else if (confirm(text)) go();
}

function tell(text) {
  if (inTelegram && tg.showAlert) tg.showAlert(text); else alert(text);
}

function fact(label, value) {
  const d = el("div");
  d.append(el("small", null, label), el("b", null, value == null || value === "" ? "—" : String(value)));
  return d;
}

function positionCard(values, at) {
  const p = Object.fromEntries(POSITION_FIELDS.map((f, i) => [f, values[i]]));
  const [venue, name, spot] = p.key.split(":");
  const title = `${TITLES[venue] || venue} ${name}`;
  const base = name.replace(/_?USDT$/, "");
  const size = p.size == null ? null : spot ? `${p.size} ${base}` : venue === "gate" ? `${p.size} контр.` : `${p.size} ${base}`;
  const card = el("section", "card"), head = el("div", "head"), h = el("h2", null, title);
  h.append(el("span", "kind", spot ? "spot" : "перп"));
  const entry = Number(p.entry), mark = Number(p.mark);
  const move = el("span", "move");
  if (entry > 0 && mark > 0) {
    const pct = (mark / entry - 1) * 100;
    move.textContent = `${pct >= 0 ? "+" : "−"}${Math.abs(pct).toFixed(2)}%`;
    move.classList.add(pct >= 0 ? "up" : "down");
  }
  head.append(h, move);
  const facts = el("div", "facts");
  const last = fact(`${spot ? "Bid" : "Цена"} на ${at}`, p.mark);
  last.className = "wide";
  facts.append(fact("Размер", size), fact("Вход", p.entry), fact(spot ? "TP (ведёт бот)" : "TP", p.tp),
               fact("SL", p.sl == null && !spot ? "ещё не стоит" : p.sl), last);
  const acts = el("div", "acts");
  const warn = () => dirty ? "\n\nНесохранённые изменения настроек пропадут." : "";
  if (p.limit != null) {
    const row = el("div", "standing"), off = el("button", "btn small ghost", "Снять");
    off.type = "button";
    off.addEventListener("click", () => ask(`Снять лимитку на закрытие ${title} по ${p.limit}?${warn()}`, () => send({v: VERSION, a: "cancel", k: p.key})));
    row.append(el("span", null, `Лимитка на закрытие: ${p.limit}`), off);
    acts.append(row);
  }
  const line = el("div", "line"), price = el("input"), put = el("button", "btn small", p.limit != null ? "Переставить" : "Лимиткой");
  price.type = "text"; price.inputMode = "decimal"; price.autocomplete = "off"; price.value = p.limit != null ? p.limit : (p.mark || "");
  price.setAttribute("aria-label", `Цена лимитки для ${title}`);
  put.type = "button";
  put.addEventListener("click", () => {
    const raw = price.value.trim().replace(",", ".").replace(/\s+/g, ""), x = Number(raw);
    price.classList.toggle("bad", !(raw !== "" && isFinite(x) && x > 0));
    if (!(raw !== "" && isFinite(x) && x > 0)) return tell("Впиши цену лимитки: число больше нуля.");
    const far = mark > 0 && x < mark ? "\n\nЦена ниже текущей: ордер исполнится сразу, как рыночный." : "";
    const stop = spot ? "\n\nНа spot биржевой SL при этом снимается: стопом будет сам бот, пока он запущен." : "\n\nSL и TP остаются.";
    ask(`Поставить лимитку на закрытие ${title} по ${raw}?${far}${stop}${warn()}`, () => send({v: VERSION, a: "close", k: p.key, how: "limit", p: raw}));
  });
  line.append(el("span", null, "Цена"), price, put);
  const now = el("button", "btn danger", "Закрыть по рынку");
  now.type = "button";
  now.addEventListener("click", () => ask(`Закрыть ${title} по рынку прямо сейчас?${warn()}`, () => send({v: VERSION, a: "close", k: p.key, how: "market"})));
  acts.append(line, now);
  card.append(head, facts, acts);
  return card;
}

function ordersPane(positions, when) {
  const pane = el("div");
  const at = when.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit", second: "2-digit"});
  if (!positions.length) {
    const empty = el("div", "empty");
    empty.append(el("b", null, "Открытых позиций нет"), document.createTextNode("Здесь появится то, что бот купит на листинге. Закрыть можно по рынку или лимиткой."));
    pane.append(empty);
  }
  for (const values of positions) pane.append(positionCard(values, at));
  pane.append(el("p", "note", `Данные на ${at} — когда бот последний раз писал в чат. Обновить: «Статус» в чате и открыть заново. После команды приложение закроется, бот ответит в чате.`));
  return pane;
}

function collect(state) {
  for (const [key, inp] of Object.entries(inputs)) {
    const why = inp.check();
    if (why) return {bad: inp, tab: key.split(".")[0], sub: inp.sub, text: `${key.startsWith("common") ? "Общее" : TITLES[key.split(".")[0]]}: ${inp.label} — ${why}`};
  }
  return {message: {v: VERSION, c: COMMON_FIELDS.map((f) => inputs[`common.${f}`].get()),
                    e: Object.fromEntries(Object.keys(state.e).map((v) => [v, VENUE_FIELDS.map((f) => inputs[`${v}.${f}`].get())]))}};
}

function send(message) {
  const text = JSON.stringify(message);
  if (!inTelegram) { const out = $("out"); out.hidden = false; out.textContent = text; out.scrollIntoView({block: "end"}); return; }
  if (tg.disableClosingConfirmation) tg.disableClosingConfirmation();
  tg.sendData(text);  // Telegram hands it to the bot as a message and closes the app
}

function start() {
  if (tg) { tg.ready(); tg.expand(); }
  let state;
  try { state = readState(); } catch (e) { return fail("Адрес повреждён", "Открой настройки заново кнопкой «⚙️ Настройки» в боте."); }
  if (!state) return fail("Нет данных", "Эта страница открывается кнопкой «⚙️ Настройки» в чате с ботом: бот передаёт ей текущие значения.");
  if (state.v !== VERSION || !Array.isArray(state.c) || state.c.length !== COMMON_FIELDS.length || !Array.isArray(state.p) ||
      Object.values(state.e || {}).some((x) => !Array.isArray(x) || x.length !== VENUE_FIELDS.length) ||
      state.p.some((x) => !Array.isArray(x) || x.length !== POSITION_FIELDS.length))
    return fail("Страница и бот разных версий", "Обнови страницу на хостинге до версии из папки miniapp бота.");
  $("app").hidden = false;
  $("preview").hidden = inTelegram;
  const mode = $("mode");
  mode.textContent = state.live ? "LIVE · торговля" : "DRY RUN · без ордеров";
  mode.classList.toggle("live", !!state.live);
  const when = new Date(state.t * 1000);
  $("asof").textContent = `${when.toLocaleDateString([], {day: "numeric", month: "short"})}, ${when.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"})}`;

  // a tab per exchange (also one the bot runs without now), one for what is common, one for the positions
  const tabs = [], cards = {};
  for (const venue of [...new Set([...Object.keys(TITLES), ...Object.keys(state.e)])]) {
    const pane = el("div"), here = !!state.e[venue];
    if (here) cards[venue] = venueCard(venue, state.e[venue]);
    pane.append(here ? cards[venue] : awayCard(venue));
    tabs.push({id: venue, title: TITLES[venue] || venue, pane, settings: here, away: !here});
  }
  tabs.push({id: "common", title: "Общее", pane: commonPane(state.c), settings: true});
  tabs.push({id: "orders", title: "Ордера", pane: ordersPane(state.p, when), settings: false, count: state.p.length});
  const nav = $("tabs"), panes = $("panes");
  let current = null;
  const save = () => {
    const got = collect(state);
    if (got.bad) {
      show(got.tab);
      const card = got.sub && cards[got.tab];
      if (card) card.showSub(got.sub);
      got.bad.node.scrollIntoView({block: "center", behavior: "smooth"});
      return tell(got.text);
    }
    send(got.message);
  };
  const show = (id) => {
    current = tabs.find((x) => x.id === id) || tabs[0];
    for (const x of tabs) {
      x.pane.hidden = x !== current;
      x.button.setAttribute("aria-selected", String(x === current));
    }
    if (inTelegram) { if (current.settings) tg.MainButton.show(); else tg.MainButton.hide(); }
    else $("save").hidden = !current.settings;
    window.scrollTo(0, 0);
  };
  for (const x of tabs) {
    x.button = el("button", "tab", x.title);
    x.button.type = "button"; x.button.setAttribute("role", "tab");
    if (x.count) x.button.append(el("span", "n", x.count));
    if (x.away || (state.e[x.id] && !state.e[x.id][0])) x.button.classList.add("dim");  // not connected, or switched off
    x.button.addEventListener("click", () => show(x.id));
    nav.append(x.button);
    panes.append(x.pane);
  }
  for (const venue of Object.keys(state.e))  // the tab of an exchange dims as soon as it is switched off
    inputs[`${venue}.enabled`].node.addEventListener("change", (e) => tabs.find((x) => x.id === venue).button.classList.toggle("dim", !e.target.checked));
  if (inTelegram) { tg.MainButton.setText("Сохранить настройки"); tg.MainButton.onClick(save); }
  else $("save").addEventListener("click", save);
  show(state.p.length ? "orders" : (tabs.find((x) => !x.away) || tabs[0]).id);
}
start();
</script>
</body>
</html>
